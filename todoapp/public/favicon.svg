<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Checkbox Frame -->
  <rect x="112" y="112" width="288" height="288" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="24"/>
  
  <!-- Sleek Task Pulse Checkmark -->
  <path d="M168 264 L228 324 L344 188" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Accent Pulse Dot -->
  <circle cx="360" cy="152" r="28" fill="#10b981" />
</svg>
